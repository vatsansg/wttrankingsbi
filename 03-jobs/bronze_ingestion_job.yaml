# WTT Rankings BI -- Step 2 bronze ingestion job
# Databricks Asset Bundle job-resource YAML (same schema as `databricks.yml`
# resources.jobs.<key>) -- paste this whole file into the Databricks Jobs UI's
# "Edit as YAML" editor to create the job. Functionally identical to
# `bronze_ingestion_job.json` in this same folder -- both are generated from
# one source and kept in sync by hand when either changes, so pick whichever
# your workspace's Create Job screen accepts.
#
# Notebook paths below are already set for this workspace:
#   /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi
# (the folder was imported there per the confirmed environment). If you ever
# re-import step2-bronze-ingestion to a different workspace path, update every
# notebook_path below (and in bronze_ingestion_job.json) to match -- Databricks
# does not validate at save time that a notebook_path actually exists, only
# that the YAML/JSON is well-formed, so a stale path surfaces later as a
# single failed task rather than an upfront error.
resources:
  jobs:
    wtt_ranking_bronze_ingestion:
      name: wtt_ranking_bronze_ingestion
      queue:
        enabled: true
      parameters:
      - name: ranking_year
        default: ''
      - name: ranking_week
        default: ''
      job_clusters:
      - job_cluster_key: bronze_job_cluster
        new_cluster:
          spark_version: 15.4.x-scala2.12
          node_type_id: Standard_DS3_v2
          num_workers: 1
          autoscale:
            min_workers: 1
            max_workers: 2
          data_security_mode: SINGLE_USER
      tasks:
      - task_key: ingest_ranking_individuals
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/01.Ingest Ranking Individuals Files
          base_parameters:
            p_ranking_year: '{{job.parameters.ranking_year}}'
            p_ranking_week: '{{job.parameters.ranking_week}}'
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_ranking_pairs
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/02.Ingest Ranking Pairs Files
          base_parameters:
            p_ranking_year: '{{job.parameters.ranking_year}}'
            p_ranking_week: '{{job.parameters.ranking_week}}'
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_players_events_results_master
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/03.Ingest Players Events Results Master
          base_parameters: {}
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_players_events_results_master_log
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/04.Ingest Players Events Results Master Log
          base_parameters: {}
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_players_events_results_master_log_archives
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/05.Ingest Players Events Results Master Log Archives
          base_parameters: {}
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_individuals_event_penalties
        job_cluster_key: bronze_job_cluster
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/06.Ingest Individuals Event Penalties
          base_parameters: {}
        libraries:
        - maven:
            coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
      - task_key: ingest_reference_and_player_tables
        for_each_task:
          inputs: '["ref_countries", "ref_continents", "ref_age_categories", "ref_categories", "ref_ranking_categories", "ref_subevent_types", "ref_subevents_codes", "ref_subevents_codes_description", "ref_subevent_dependent_categories", "ref_organization", "ref_event_type_general", "ref_result_position", "competitors", "players_doubles"]'
          concurrency: 6
          task:
            task_key: ingest_reference_and_player_tables_iteration
            job_cluster_key: bronze_job_cluster
            notebook_task:
              notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/07.Ingest Reference Table (Generic)
              base_parameters:
                p_table_key: '{{input}}'
            libraries:
            - maven:
                coordinates: com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11
            max_retries: 2
            min_retry_interval_millis: 60000
            retry_on_timeout: true
      - task_key: validate_all_bronze_tables
        job_cluster_key: bronze_job_cluster
        depends_on:
        - task_key: ingest_ranking_individuals
        - task_key: ingest_ranking_pairs
        - task_key: ingest_players_events_results_master
        - task_key: ingest_players_events_results_master_log
        - task_key: ingest_players_events_results_master_log_archives
        - task_key: ingest_individuals_event_penalties
        - task_key: ingest_reference_and_player_tables
        notebook_task:
          notebook_path: /Workspace/Users/vatsan@worldtabletennis.com/wttrankingsbi/02-bronze/09.Validate All Bronze Tables
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
